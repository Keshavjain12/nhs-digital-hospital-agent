[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhs-hospital-agent-api"
version = "0.1.0"
description = "NHS Digital Hospital Agent - backend API (student project, not an NHS service)"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # [email] pulls in email-validator, required by EmailStr in the auth schemas.
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    # Shared rate-limit counters. Without it the limiter is per-process, so the configured
    # limit is multiplied by the worker count - see app/core/ratelimit.py.
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools]
# Explicit: `tests`, `scripts` and `alembic` are top-level directories but are not
# part of the distributable package, and auto-discovery cannot tell that.
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test; the "passwords" are fixtures for redaction tests and
# are deliberately fake values that must appear in source to prove they get scrubbed.
"tests/**" = ["S101", "S105", "S106"]
# Non-cryptographic RNG is the correct choice for reproducible synthetic data generation.
"scripts/**" = ["S311"]
# Error classes are named for the condition they represent, which reads better at the
# raise site (`raise ResourceNotFound()`), and the AppError base already carries the
# suffix. Renaming eleven classes to satisfy a naming rule would not improve the code.
"app/core/errors.py" = ["N818"]
# SQLAlchemy's declarative API requires __table_args__ to be a dict/tuple class attribute,
# and aliasing the dialect's UUID type keeps model columns readable. Both are the library's
# idiom, not accidents.
"app/models/*.py" = ["RUF012", "N811"]
"alembic/versions/*.py" = ["E501"]
# "Bearer" is an OAuth token *type* name, and the audit constants are event names such as
# TOKEN_REFRESHED. Neither is a credential; the rule matches on the identifier text alone.
"app/schemas/auth.py" = ["S105"]
"app/models/audit.py" = ["S105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a live PostgreSQL database",
    "security: authorisation, authentication and data-leakage tests",
    "concurrency: booking race-condition tests; require real PostgreSQL",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
