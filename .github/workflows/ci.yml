# Continuous integration: every push to main and every pull request.
#
# The sprint plan (FS-1.2) called for this in Sprint 1, and it did not exist until after
# Sprint 4 - every check before then was run by hand. What runs here is what a change must
# pass.
#
# Not here: the Playwright browser suites. They need the whole stack running with seeded data
# and three browser engines, and are run against a live stack instead. See
# docs/testing/cross-browser.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hospital
          # A database that exists for one run, inside the runner. Derived from the run id
          # rather than written down, so no credential is committed to the repository.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: hospital
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospital -d hospital"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://hospital:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/hospital
      ENVIRONMENT: testing

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Generate a throwaway JWT secret
        # The settings refuse to start without one, and there is deliberately no default.
        run: echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy app scripts

      - name: Tests, against real PostgreSQL
        run: pytest -q

      - name: Export the OpenAPI document
        run: python -c "import json; from app.main import create_app; print(json.dumps(create_app().openapi()))" > openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.json

  frontend:
    name: Frontend - lint, types, tests, build, API contract
    runs-on: ubuntu-latest
    needs: backend

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: frontend/ci

      - name: API contract has not drifted
        # types/generated/api.d.ts is generated from the backend's OpenAPI document. If the
        # backend changed and nobody regenerated it, the frontend is compiling against a
        # contract that no longer exists. This is the check that says so.
        run: |
          npx openapi-typescript ci/openapi.json -o ci/api.d.ts
          diff -u types/generated/api.d.ts ci/api.d.ts
