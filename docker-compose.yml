name: nhs-hospital-agent

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hospital}
    ports:
      # Host port defaults to 5433, not 5432. A native PostgreSQL install on the host
      # binds 5432 and silently wins the mapping, so tools connecting to localhost:5432
      # reach that server instead of this container - which presents as a confusing
      # "password authentication failed" rather than as a port conflict.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API must not start against a database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital} -d ${POSTGRES_DB:-hospital}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    # Rate-limit counters only - no persistence wanted. Losing them on restart resets a
    # limit, which is the same thing the old in-process limiter did on every deploy.
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    env_file: .env
    environment:
      # Overrides the .env value so the container reaches Postgres by service name.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hospital}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
